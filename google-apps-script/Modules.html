function activityTable(items) {

}

async function renderActivities(filters={}) {

function filterReports(items) {
  if (!state.filterStatus) return items;
  const filter=String(state.filterStatus).toUpperCase();
  return items.filter(row=>{
    const deadline=String(row.status_deadline||'').toUpperCase(),status=String(row.status_hitung||'').toUpperCase();
    if (filter==='SELESAI') return deadline==='SELESAI'||status.includes('NET');
    if (filter==='AKTIF') return deadline!=='SELESAI';
    return deadline===filter||status===filter;
  });
}

  state.currentReports=data.items;

  const rows=items.length?items.map(row=>`<tr class="clickable" data-action="report-detail" data-id="${esc(row.report_id)}"><td class="mono">${esc(row.report_id)}</td><td><strong>${esc(row.perusahaan||'—')}</strong></td><td>${esc(row.kebun||'—')}</td><td>${esc(row.nama_kegiatan||'—')}</td><td>${dateText(row.tanggal_draft_masuk)}</td><td>${dateText(row.deadline)}</td><td class="mono">${angka.format(row.hari_berjalan||0)}</td><td>${miniCheckpoints(reportStageCount(row))}</td><td>${statusBadge(row.status_deadline)}</td><td>${esc(row.pic||'—')}</td></tr>`).join(''):`<tr><td colspan="10" class="row-empty">Tidak ada laporan untuk filter ini.</td></tr>`;

  content.innerHTML=`${pageHead(titles[key][0],titles[key][1],'<button class="button secondary" data-action="run-monitor">Jalankan Reminder</button>')}<section class="summary"><article><small>Total Laporan</small><strong>${data.total}</strong></article><article><small>Aktif</small><strong>${data.total-totals.done}</strong></article><article class="success"><small>Aman</small><strong>${totals.safe}</strong></article><article class="warning"><small>Perhatian / Segera</small><strong>${totals.warning+totals.soon}</strong></article><article class="danger"><small>Terlambat</small><strong>${totals.late}</strong></article><article class="success"><small>NET</small><strong>${totals.done}</strong></article></section><div class="filterbar"><select id="report-status-filter" class="filter-select" aria-label="Filter status">${filterOptions}</select><select class="filter-select" aria-label="Filter tahun"><option>${state.year||'Semua tahun'}</option></select><select class="filter-select" aria-label="Filter regional"><option>Semua regional</option></select><input class="input" data-role="query" value="${esc(state.query)}" placeholder="Cari perusahaan, kebun, PIC…"><button class="button secondary" data-action="search">Cari</button><span class="spacer"></span><span class="badge info">SLA 30 HARI</span></div><section class="panel">${sectionHead('Timeline Laporan',`${items.length} dari ${data.total} laporan · klik baris untuk detail`)}<div class="tablewrap"><table><thead><tr><th>ID</th><th>Perusahaan</th><th>Kebun</th><th>Kegiatan</th><th>Draft</th><th>Deadline</th><th>Hari ke-</th><th>Checkpoint</th><th>Status</th><th>PIC</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

async function renderReportDetail(reportId) {
  if (!reportId) { navigate(state.returnView||'reports-rp'); return; }
  const [reports,histories]=await Promise.all([getModule('reports',{report_id:reportId}),getModule('reportHistory',{report_id:reportId})]);
  const row=reports.items[0];
  if (!row) { content.innerHTML=pageHead('Detail Laporan','Record tidak ditemukan.')+emptyState('Laporan tidak ditemukan','Periksa kembali ID laporan atau data pada Google Sheet.'); return; }
  const stage=reportStageCount(row),labels=['DRAFT','KOREKTOR 1','KOREKTOR 2','CETAK 1','KOREKTOR 1 CETAK','KOREKTOR 2 CETAK','NET / RP27'];
  const timeline=labels.map((label,index)=>{const history=histories.items.find(item=>String(item.checkpoint||'').toUpperCase()===label);const cls=index<stage?'done':index===stage?'current':'';return `<div class="timeline-step ${cls}"><span class="timeline-dot">${index<stage?'✓':index+1}</span><strong>${label}</strong><small>${history?dateText(history.tanggal_selesai||history.tanggal_masuk):index<stage?'Selesai':'Menunggu'}</small><small>${esc(history?.korektor||'')}</small></div>`}).join('');
  content.innerHTML=`${pageHead('Detail Laporan','Monitoring checkpoint dan dokumen laporan',`<button class="button secondary" data-view="${state.returnView||'reports-rp'}">← Kembali</button>`)}<section class="report-hero"><div><span class="section-kicker">${esc(row.report_id)}</span><h2>${esc(row.perusahaan||'—')}</h2><p>${esc(row.nama_kegiatan||'Laporan')} · ${esc(row.kebun||'Tanpa kebun')}</p></div><div class="report-health"><span>STATUS · HARI ${angka.format(row.hari_berjalan||0)} / 30</span><strong>${esc(row.status_deadline)}</strong>${progressBar(row.persentase_waktu,`Deadline ${dateText(row.deadline)}`)}</div></section><section class="panel">${sectionHead('Timeline Penyelesaian','Tujuh checkpoint laporan; deadline tetap 30 hari')}<div class="timeline-detail">${timeline}</div></section><section class="detail-grid" style="margin-top:12px"><article class="detail-card"><small>Korektor Terakhir</small><strong>${esc(row.korektor_terakhir||'Belum ditentukan')}</strong></article><article class="detail-card"><small>Tanggal Checkpoint</small><strong>${dateText(row.tanggal_checkpoint)}</strong></article><article class="detail-card"><small>PIC</small><strong>${esc(row.pic||'Belum ditentukan')}</strong></article><article class="detail-card"><small>Dokumen Draft</small><strong>${esc(row.nama_file_draft||'Belum diunggah')}</strong></article><article class="detail-card"><small>Dokumen NET</small><strong>${esc(row.file_net||row.rp27||'Belum tersedia')}</strong></article><article class="detail-card"><small>Catatan</small><strong>${esc(row.catatan||'Tidak ada catatan')}</strong></article></section>`;
}

async function renderLabs() {
  const data=await getModule('labs'),now=Date.now();
  const enriched=data.items.map(row=>{const start=row.tanggal_sampel_masuk?new Date(row.tanggal_sampel_masuk+'T00:00:00+07:00'):null;return Object.assign({},row,{age:start&&!isNaN(start)?Math.max(0,Math.floor((now-start.getTime())/86400000)):0})});
  const leaf=enriched.filter(row=>String(row.jenis_analisis).toUpperCase()==='DAUN'),soil=enriched.filter(row=>String(row.jenis_analisis).toUpperCase()==='TANAH'),active=enriched.filter(row=>String(row.status).toUpperCase()!=='SELESAI'),done=enriched.filter(row=>String(row.status).toUpperCase()==='SELESAI'),old=active.filter(row=>row.age>30),kcd=enriched.reduce((sum,row)=>sum+Number(row.jumlah_kcd||0),0);
  const rows=enriched.length?enriched.map(row=>`<tr><td><strong>${esc(row.perusahaan)}</strong><br><span class="muted">${esc(row.kebun||'—')}</span></td><td>${statusBadge(row.jenis_analisis)}</td><td class="number">${angka.format(row.jumlah_kcd||0)}</td><td>${dateText(row.tanggal_sampel_masuk)}</td><td class="mono">${row.age} hari</td><td>${statusBadge(row.status)}</td><td>${esc(row.pic||'—')}</td></tr>`).join(''):`<tr><td colspan="7" class="row-empty">Belum ada sampel laboratorium.</td></tr>`;
  content.innerHTML=`${pageHead(...titles.labs)}<section class="summary"><article><small>Total KCD</small><strong>${angka.format(kcd)}</strong></article><article><small>Daun</small><strong>${angka.format(leaf.reduce((s,r)=>s+Number(r.jumlah_kcd||0),0))}</strong></article><article><small>Tanah</small><strong>${angka.format(soil.reduce((s,r)=>s+Number(r.jumlah_kcd||0),0))}</strong></article><article><small>Dalam Proses</small><strong>${active.length}</strong></article><article class="success"><small>Selesai</small><strong>${done.length}</strong></article><article class="danger"><small>Sampel Terlalu Lama</small><strong>${old.length}</strong></article></section><section class="module-grid" style="margin-bottom:12px"><article class="panel">${sectionHead('Trend Umur Sampel','Distribusi umur proses aktif')}<div class="mini-chart">${[['0–7',active.filter(r=>r.age<=7).length],['8–14',active.filter(r=>r.age>7&&r.age<=14).length],['15–30',active.filter(r=>r.age>14&&r.age<=30).length],['>30',old.length]].map(item=>`<div style="--h:${Math.max(4,item[1]/Math.max(1,active.length)*100)}%"><small>${item[0]}</small></div>`).join('')}</div></article><article class="panel">${sectionHead('Distribusi Daun / Tanah','Jumlah record')}${donutChart(enriched.length,'Sampel',[{label:'Daun',value:leaf.length,color:'#14b8a6'},{label:'Tanah',value:soil.length,color:'#ff9800'}])}</article></section><section class="panel">${sectionHead('Sampel Aktif','Umur dihitung otomatis dari tanggal masuk')}<div class="tablewrap"><table><thead><tr><th>Perusahaan / Kebun</th><th>Jenis</th><th>KCD</th><th>Tanggal Masuk</th><th>Umur Sampel</th><th>Status</th><th>PIC</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

async function renderJid(catalogOnly=false) {
  const [products,transactions,stock]=await Promise.all([getModule('products'),getModule('jid'),getModule('stock')]);
  const revenue=transactions.items.reduce((sum,row)=>sum+Number(row.nilai||0),0),sold=transactions.items.reduce((sum,row)=>sum+Number(row.jumlah||0),0),unbilled=transactions.items.filter(row=>!String(row.status_tagihan).toUpperCase().includes('LUNAS')),receivable=unbilled.reduce((sum,row)=>sum+Number(row.nilai||0),0),procurement=stock.items.filter(row=>!['PENJUALAN','KELUAR','PENYESUAIAN KELUAR'].includes(String(row.jenis_mutasi).toUpperCase())).reduce((sum,row)=>sum+Number(row.jumlah||0),0);
  const cards=products.items.length?products.items.map(row=>`<article class="product-card"><div class="product-image">${row.foto?`<img src="${esc(row.foto)}" alt="${esc(row.nama)}" loading="lazy">`:svgIcon('box')}</div><div class="product-body"><h3>${esc(row.nama)}</h3><div class="product-stock"><span><small>Stok</small><strong>${angka.format(row.stok)} ${esc(row.satuan||'unit')}</strong></span>${statusBadge(row.kritis?'STOK RENDAH':'TERSEDIA')}</div><div class="product-footer"><b>${money(row.harga)}</b><button class="button secondary small" data-action="product-detail" data-id="${esc(row.product_id)}">Detail</button></div></div></article>`).join(''):emptyState('Belum ada produk','Tambahkan produk pada Google Sheet master.');
  const txRows=transactions.items.length?transactions.items.map(row=>`<tr><td class="mono">${esc(row.transaction_id)}</td><td>${esc(row.product_id)}</td><td><strong>${esc(row.perusahaan||'—')}</strong></td><td>${dateText(row.tanggal)}</td><td class="number">${angka.format(row.jumlah||0)}</td><td class="number">${money(row.nilai)}</td><td>${statusBadge(row.status_tagihan)}</td></tr>`).join(''):`<tr><td colspan="7" class="row-empty">Belum ada transaksi JID.</td></tr>`;
  content.innerHTML=`${pageHead(catalogOnly?'Katalog Produk':'JID & Inventory',catalogOnly?'Daftar produk dan informasi stok terkini':titles.jid[1])}<section class="summary"><article><small>Pendapatan</small><strong>${compact(revenue)}</strong></article><article><small>Penjualan</small><strong>${angka.format(sold)} unit</strong></article><article><small>Stok</small><strong>${angka.format(products.items.reduce((s,r)=>s+Number(r.stok||0),0))}</strong></article><article><small>Pengadaan</small><strong>${angka.format(procurement)}</strong></article><article class="warning"><small>Belum Ditagih</small><strong>${unbilled.length}</strong></article><article class="danger"><small>Piutang</small><strong>${compact(receivable)}</strong></article></section><section class="product-grid">${cards}</section>${catalogOnly?'':`<section class="panel">${sectionHead('Transaksi JID','Penjualan dan status penagihan produk')}<div class="tablewrap"><table><thead><tr><th>ID</th><th>Produk</th><th>Perusahaan</th><th>Tanggal</th><th>Jumlah</th><th>Nilai</th><th>Tagihan</th></tr></thead><tbody>${txRows}</tbody></table></div></section>`}`;
}

function overlap(left,right) { const a=new Date(left.tanggal_mulai),b=new Date(left.tanggal_selesai||left.tanggal_mulai),c=new Date(right.tanggal_mulai),d=new Date(right.tanggal_selesai||right.tanggal_mulai); return ![a,b,c,d].some(isNaN)&&a<=d&&c<=b; }

async function trainingData() {
  const [training,schedules,souvenirs,souvenirTx]=await Promise.all([getModule('training'),getModule('expertSchedules'),getModule('souvenirs'),getModule('souvenirTransactions')]);
  let conflicts=0;
  schedules.items.forEach((left,index)=>schedules.items.slice(index+1).forEach(right=>{if(left.expert_id===right.expert_id&&overlap(left,right)) conflicts+=1}));
  const stock={};souvenirTx.items.forEach(row=>{const outbound=['KELUAR','DISTRIBUSI','PEMAKAIAN'].includes(String(row.jenis_mutasi).toUpperCase());stock[row.item_id]=(stock[row.item_id]||0)+(outbound?-1:1)*Number(row.jumlah||0)});
  const low=souvenirs.items.filter(row=>(stock[row.item_id]||0)<=Number(row.minimum_stok||0)).length;
  return {training,schedules,souvenirs,souvenirTx,conflicts,low,stock};
}

function trainingCalendar(items) {
  const start=new Date();start.setHours(0,0,0,0);
  return `<div class="calendar-strip">${Array.from({length:7},(_,index)=>{const day=new Date(start);day.setDate(start.getDate()+index);const iso=day.toISOString().slice(0,10);const events=items.filter(row=>String(row.tanggal_mulai).slice(0,10)===iso);return `<article class="calendar-day ${index===0?'today':''}"><strong>${day.toLocaleDateString('id-ID',{weekday:'short'})}</strong><small>${day.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})}</small>${events.slice(0,2).map(row=>`<span class="calendar-event">${esc(row.nama_kegiatan)}</span>`).join('')}</article>`}).join('')}</div>`;
}

  const data=await trainingData(),items=data.training.items,participants=items.reduce((sum,row)=>sum+Number(row.jumlah_peserta||0),0),now=new Date(),upcoming=items.filter(row=>row.tanggal_mulai&&new Date(row.tanggal_mulai+'T00:00:00+07:00')>=now),done=items.filter(row=>String(row.status).toUpperCase()==='SELESAI');
  const rows=items.length?items.map(row=>`<tr><td>${dateText(row.tanggal_mulai)}</td><td><strong>${esc(row.perusahaan||'—')}</strong></td><td>${esc(row.nama_kegiatan)}</td><td>${esc(row.lokasi||'—')}</td><td class="number">${angka.format(row.jumlah_peserta||0)}</td><td>${esc(row.pic||'—')}</td><td>${statusBadge(row.status)}</td></tr>`).join(''):`<tr><td colspan="7" class="row-empty">Belum ada kegiatan pelatihan.</td></tr>`;
  content.innerHTML=`${pageHead(calendarOnly?'Kalender Pelatihan':'Kegiatan Pelatihan',titles.training[1])}<section class="summary"><article><small>Total Kegiatan</small><strong>${items.length}</strong></article><article><small>Akan Datang</small><strong>${upcoming.length}</strong></article><article><small>Total Peserta</small><strong>${angka.format(participants)}</strong></article><article class="success"><small>Selesai</small><strong>${done.length}</strong></article><article class="danger"><small>Konflik Tenaga Ahli</small><strong>${data.conflicts}</strong></article><article class="warning"><small>Stok Souvenir Kurang</small><strong>${data.low}</strong></article></section><section class="panel" style="margin-bottom:12px">${sectionHead('Kalender 7 Hari','Agenda pelatihan terdekat')}${trainingCalendar(items)}</section>${calendarOnly?'':`<section class="panel">${sectionHead('Upcoming Training','Jadwal, peserta, tenaga ahli, dan kesiapan')}<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Perusahaan</th><th>Kegiatan</th><th>Lokasi</th><th>Peserta</th><th>PIC / Tenaga Ahli</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}`;
}

async function renderSouvenirs() {
  const data=await trainingData();
  const rows=data.souvenirs.items.length?data.souvenirs.items.map(row=>{const available=data.stock[row.item_id]||0;return `<tr><td class="mono">${esc(row.item_id)}</td><td><strong>${esc(row.nama)}</strong></td><td>${esc(row.satuan||'unit')}</td><td class="number">${angka.format(available)}</td><td class="number">${angka.format(row.minimum_stok||0)}</td><td>${statusBadge(available<=Number(row.minimum_stok||0)?'STOK RENDAH':'TERSEDIA')}</td></tr>`}).join(''):`<tr><td colspan="6" class="row-empty">Belum ada master souvenir.</td></tr>`;
  content.innerHTML=`${pageHead('Souvenir Pelatihan','Stok, mutasi, dan kebutuhan kegiatan')}<section class="summary"><article><small>Jenis Souvenir</small><strong>${data.souvenirs.total}</strong></article><article class="warning"><small>Stok Kurang</small><strong>${data.low}</strong></article><article><small>Transaksi</small><strong>${data.souvenirTx.total}</strong></article></section><section class="panel">${sectionHead('Inventori Souvenir','Saldo dihitung dari ledger transaksi')}<div class="tablewrap"><table><thead><tr><th>ID</th><th>Souvenir</th><th>Satuan</th><th>Stok</th><th>Minimum</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

async function renderBilling() {
  const data=await getModule('billing'),total=data.items.reduce((s,r)=>s+Number(r.nilai||0),0),paid=data.items.reduce((s,r)=>s+Number(r.total_pembayaran||0),0),receivable=data.items.reduce((s,r)=>s+Number(r.piutang||0),0),ready=data.items.filter(r=>r.status_hitung==='SIAP TAGIH'),invoiced=data.items.filter(r=>r.nomor_invoice),paidRows=data.items.filter(r=>r.status_hitung==='LUNAS');
  const aging=['0–30','31–60','61–90','>90'].map(label=>[label,data.items.filter(row=>row.aging===label).reduce((sum,row)=>sum+Number(row.piutang||0),0)]);
  const rows=data.items.length?data.items.map(row=>`<tr><td class="mono">${esc(row.billing_id)}</td><td><strong>${esc(row.perusahaan||'—')}</strong></td><td>${esc(row.source_type||'—')}<br><span class="muted mono">${esc(row.source_id||'—')}</span></td><td class="number">${money(row.nilai)}</td><td>${esc(row.nomor_invoice||'—')}</td><td>${dateText(row.jatuh_tempo)}</td><td>${statusBadge(row.status_hitung)}</td><td><button class="button secondary small" data-action="database">Detail</button></td></tr>`).join(''):`<tr><td colspan="8" class="row-empty">Belum ada tagihan.</td></tr>`;
  content.innerHTML=`${pageHead(...titles.billing,'<button class="button secondary" data-action="run-monitor">Periksa Jatuh Tempo</button>')}<section class="summary"><article class="warning"><small>Siap Tagih</small><strong>${ready.length}</strong></article><article><small>Total Invoice</small><strong>${invoiced.length}</strong></article><article class="danger"><small>Piutang</small><strong>${compact(receivable)}</strong></article><article class="success"><small>Lunas</small><strong>${paidRows.length}</strong></article><article><small>Nilai Tagihan</small><strong>${compact(total)}</strong></article><article><small>Dibayar</small><strong>${compact(paid)}</strong></article></section><section class="panel" style="margin-bottom:12px">${sectionHead('Aging Piutang','Saldo piutang berdasarkan umur invoice')}<div class="aging">${aging.map(item=>`<article><small>${item[0]} hari</small><strong>${compact(item[1])}</strong></article>`).join('')}</div></section><section class="panel">${sectionHead('Daftar Billing','Tagihan lintas subbagian dan status pembayaran')}<div class="tablewrap"><table><thead><tr><th>Billing ID</th><th>Perusahaan</th><th>Sumber / Kegiatan</th><th>Nilai</th><th>Invoice</th><th>Jatuh Tempo</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

async function renderRegional() {
  const items=state.dashboard.regional||[];
  const rows=items.length?items.map(row=>`<tr><td><strong>${esc(row.regional)}</strong></td><td class="number">${row.total}</td><td class="number">${row.proses}</td><td class="number">${row.selesai}</td><td>${statusBadge(row.terlambat?`${row.terlambat} terlambat`:'AMAN')}</td><td>${progressBar(row.completion,`${row.completion}% selesai`)}</td></tr>`).join(''):`<tr><td colspan="6" class="row-empty">Belum ada laporan regional.</td></tr>`;

async function renderSimple(module,key,columns,options={}) {
  const data=await getModule(module),rows=data.items.length?data.items.map(row=>`<tr>${columns.map(col=>`<td class="${col.cls||''}">${col.render?col.render(row[col.key],row):esc(row[col.key]||'—')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${columns.length}" class="row-empty">${esc(options.empty||'Belum ada data.')}</td></tr>`;
  content.innerHTML=`${pageHead(...titles[key])}${toolbar()}<section class="panel">${sectionHead(`${data.total} record`,'Data aktif dari Google Sheet master','<button class="button secondary small" data-action="database">Buka Database</button>')}<div class="tablewrap"><table><thead><tr>${columns.map(col=>`<th>${esc(col.label)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

async function renderValidation() {
  const data=await callServer('validateData');
  const rows=data.items.length?data.items.map(row=>`<tr><td>${statusBadge(row.level)}</td><td class="mono">${esc(row.table)}</td><td class="mono">${esc(row.recordId||'—')}</td><td>${esc(row.message)}</td></tr>`).join(''):`<tr><td colspan="4" class="row-empty">✓ Tidak ditemukan masalah pada pemeriksaan dasar.</td></tr>`;
  content.innerHTML=`${pageHead(...titles.validation,'<button class="button secondary" data-action="refresh">Jalankan Ulang</button>')}<section class="summary"><article><small>Total Masalah</small><strong>${data.total}</strong></article><article class="danger"><small>Error</small><strong>${data.errors}</strong></article><article class="warning"><small>Warning</small><strong>${data.warnings}</strong></article><article class="success"><small>Status</small><strong>${data.errors?'Perlu Tindakan':'Valid'}</strong></article></section><section class="panel">${sectionHead('Hasil Validasi','Error harus diperbaiki sebelum impor atau perubahan besar',`<button class="button secondary small" data-view="audit">Lihat Audit Log</button>`)}<div class="tablewrap"><table><thead><tr><th>Level</th><th>Tabel</th><th>Record</th><th>Masalah</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
