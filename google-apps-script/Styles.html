.lower-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(335px,.7fr);gap:12px;margin-bottom:12px}.tablewrap{max-width:100%;overflow-x:auto;border:1px solid #e5ebf1;border-radius:7px;background:#fff}.tablewrap::-webkit-scrollbar{height:7px}.tablewrap::-webkit-scrollbar-thumb{border-radius:6px;background:#ccd7e2}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th{padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;color:#72869a;font-size:8px;font-weight:700;letter-spacing:.045em;text-align:left;text-transform:uppercase;white-space:nowrap}td{padding:9px;border-bottom:1px solid #edf2f6;color:var(--ink2);font-size:9.5px;vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr[data-action],tbody tr.clickable{cursor:pointer}tbody tr:hover td{background:#f9fbfd;color:var(--ink)}td strong{color:var(--ink);font-weight:600}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:8.7px}.muted{color:var(--muted)}.number{text-align:right;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid #d7e3ed;border-radius:10px;background:#f4f7fa;color:#607589;font-size:7.5px;font-weight:700;white-space:nowrap;text-transform:uppercase}.badge:before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}.badge.success{border-color:#bdebdc;background:#e9f9f3;color:#078a64}.badge.teal{border-color:#b5e9e3;background:#e7f8f6;color:#0a8c80}.badge.warning{border-color:#fee0ae;background:#fff6e5;color:#d77900}.badge.attention{border-color:#f7e597;background:#fffbea;color:#a97900}.badge.danger{border-color:#ffc5ca;background:#ffeff0;color:#d93443}.badge.info{border-color:#beddf8;background:#edf7ff;color:#1678c4}.badge.purple{border-color:#dec7f5;background:#f6effd;color:#8140bd}.progress{min-width:94px}.track{height:4px;overflow:hidden;border-radius:4px;background:#e9eff4}.track span{display:block;height:10
